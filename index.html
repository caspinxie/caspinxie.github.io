
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPS Build Analyzer</title>
<style>
  :root{
    --bg:#0e1117; --panel:#1a1f2b; --line:#2b3242; --text:#e8edf7;
    --muted:#8b95ab; --accent:#6ea8fe; --good:#5ad18a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px;min-height:100vh;color:var(--text);
    background:radial-gradient(1200px 600px at 50% -10%, #1d2740, #0e1117 60%);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
  }
  h1{font-size:22px;font-weight:700;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;color:var(--muted);letter-spacing:.03em}
  input,select{
    background:#0f141d;border:1px solid var(--line);border-radius:9px;color:var(--text);
    padding:9px 11px;font-size:14px;font-family:inherit;outline:none;transition:.15s;width:100%;
  }
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.15)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
  button{
    background:linear-gradient(180deg,#4b8ef8,#3468c9);border:0;border-radius:10px;color:#fff;
    font-weight:600;font-size:15px;padding:11px 22px;cursor:pointer;transition:.15s;
  }
  button:hover{filter:brightness(1.1)}
  button:active{transform:translateY(1px)}
  button.ghost{
    background:#1c2432;border:1px solid var(--line);color:var(--muted);
    font-size:13px;font-weight:500;padding:8px 14px;
  }
  button.ghost:hover{color:var(--text);border-color:var(--accent)}
  .tbl-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 12px;text-align:center;white-space:nowrap}
  th{background:#141a25;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.04em}
  td.rowhead{color:var(--muted);font-size:12px;background:#141a25}
  td.dps{font-variant-numeric:tabular-nums;color:#cfe1ff}
  td.total{color:var(--good);font-weight:700;font-variant-numeric:tabular-nums}
  .info{color:var(--muted);font-size:13px;margin-bottom:12px;white-space:pre-line;font-variant-numeric:tabular-nums}
  .err{color:#ff7b7b;font-size:14px}
  .note{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.7}
  code{background:#0f141d;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
</style>
</head>
<body>

<h1>DPS Build Analyzer</h1>
<div class="sub">花瓣 / 天赋 / 生物体伤 / 生物护甲 &nbsp;→&nbsp; 各花瓣 DPS 与总 DPS</div>

<div class="panel">
  <div class="grid">
    <div class="field" style="grid-column:span 2">
      <label>花瓣（空格分隔，可加数量前缀）</label>
      <input id="build" value="2ugl_ 4dust bur 2ulentil" spellcheck="false" maxlength="297">
    </div>
    <div class="field" style="grid-column:span 2">
      <label>天赋（ph reload summon luck poison cpoison dup [rot]）</label>
      <input id="talent" value="- Et - - - - S" spellcheck="false">
    </div>
    <div class="field">
      <label>生物体伤 x</label>
      <input id="x" type="number" step="any" value="21870">
    </div>
    <div class="field">
      <label>生物护甲 y</label>
      <input id="y" type="number" step="any" value="583.2">
    </div>
    <div class="field">
      <label>模式</label>
      <select id="mode">
        <option value="lentil">lentil</option>
        <option value="yy">yy</option>
        <option value="wheel">wheel</option>
      </select>
    </div>
    <div class="field">
      <label>lentil 距离</label>
      <input id="lentildis" type="number" step="any" value="0">
    </div>
    <div class="field">
      <label>转速 rotspeed</label>
      <input id="rotspeed" type="number" step="any" value="1">
    </div>
  </div>

  <div class="actions">
    <button id="run">计算 DPS</button>
    <button class="ghost" data-ex="1">示例：triangle wheel</button>
    <button class="ghost" data-ex="2">示例：chip yy</button>
    <button class="ghost" data-ex="3">示例：dust lentil</button>
  </div>
</div>

<div class="panel">
  <div id="info" class="info"></div>
  <div id="out"></div>
</div>

<div class="note">
  用法：花瓣前加数字表示多个（如 <code>2pearl</code>）；不计入 DPS 但发挥效果的花瓣加下划线（如 <code>ugl_</code>）；被 yy 的花瓣写成 <code>bur(yy)</code>。<br>
  原作者：Huo_guo_tu31
</div>

<script>
/* ========================= 常量表 ========================= */
const ph_buff      = {"-":1,"C":1.15,"Un":1.15**2,"R":1.15**3,"E":1.15**4,"L":1.15**5,"M":1.15**6,"U":1.15**7,"S":1.15**8,"Et":1.15**10};
const reload_buff  = {"-":1,"C":0.9,"Un":0.9**2,"R":0.9**3,"E":0.9**4,"L":0.9**4*0.8,"M":0.9**4*0.8**2,"U":0.9**4*0.8**3,"S":0.9**4*0.8**4,"Et":0.9**4*0.8**4*0.7};
const summoner_buff= {"-":1,"C":1.15,"Un":1.15**2,"R":1.15**3,"E":1.15**4,"L":1.15**5,"M":1.15**6,"U":1.15**7,"S":1.15**8,"Et":1.15**10};
const luck_buff    = {"-":0,"C":0.1,"Un":0.25,"R":0.45,"E":0.7,"L":1,"M":1.35,"U":1.75,"S":2.2,"Et":2.7};
const poison_buff  = {"-":1,"1":1.0625,"2":1.125,"3":1.1875,"4":1.25,"5":1.3125,"6":1.375,"7":1.4375,"8":1.5,"9":1.5625};
const cpoison_buff = {"-":1,"+":1.2};
const dup_buff     = {"-":0,"L":1,"U":2,"S":3,"Et":3};
const rot_buff     = {"-":0,"C":0.6,"Un":1.2,"R":1.8,"E":2.4,"L":3};

/* ========================= 全局状态 ========================= */
let petalhealth, reload, summoner, luck, poison, dup, rot, T,
    ed, ea, dis, udl, dl, qdl, ph_bonus, ugl, gl, qgl, utri, tri;

/* ========================= 工具函数 ========================= */
const rnd = x => Math.max(x, 0.05);

// Python 的 round（银行家舍入）
function pyRound(v){
  const f = Math.floor(v), diff = v - f;
  if (diff > 0.5) return f + 1;
  if (diff < 0.5) return f;
  return f % 2 === 0 ? f : f + 1;
}

/* ========================= 伤害模型 ========================= */
function d(pd, ph = 1, typ = ""){
  let res = 0, m = ph;
  if (typ === "ubattery" || typ === "ulightning") return pd * 8;
  if (typ === "battery"  || typ === "lightning")  return pd * 9;
  if (typ === "qbattery" || typ === "qlightning") return pd * 10;

  if (typ === "ubone"){
    let pa = 7290;
    while (m > 0){ res += Math.max(0, pd*m/ph - ea); m -= Math.max(0, ed - pa); pa /= 2; }
    return res;
  }
  if (typ === "bone"){
    let pa = 21870;
    while (m > 0){ res += Math.max(0, pd*m/ph - ea); m -= Math.max(0, ed - pa); pa /= 2; }
    return res;
  }
  if (typ === "qbone"){
    let pa = 65610;
    while (m > 0){ res += Math.max(0, pd*m/ph - ea); m -= Math.max(0, ed - pa); pa /= 2; }
    return res;
  }
  if (typ === "uclaw"){ while (m > 0){ res += Math.max(0, pd*m/ph - ea + 72900);  m -= ed; } return res; }
  if (typ === "claw") { while (m > 0){ res += Math.max(0, pd*m/ph - ea + 218700); m -= ed; } return res; }
  if (typ === "qclaw"){ while (m > 0){ res += Math.max(0, pd*m/ph - ea + 656100); m -= ed; } return res; }

  if (typ === "ubgg" || typ === "bgg" || typ === "qbgg" ||
      typ === "uagg" || typ === "agg" || typ === "qagg" ||
      typ === "ustick" || typ === "stick" || typ === "qstick"){
    return Math.max(0, pd - ea) * Math.ceil(ph / ed);
  }
  if (typ === "qmjolnir"){
    while (m > 0){ res += Math.max(0, pd*m/ph); m -= ed; }
    return res;
  }
  while (m > 0){ res += Math.max(0, pd*m/ph - ea); m -= ed; }
  return res;
}

const h  = ph => ph * (petalhealth + 0.3*udl + 0.45*dl + 0.6*qdl);
const mh = ph => ph * summoner;
const fx = x => (x === 0 ? 0 : 0.0003664 * (x - 13.06));

function r(rel, ph = 1){
  let res = rnd(rel * reload * (0.825**ugl) * (0.8**gl) * (0.775**qgl) * (1.05**(udl+dl+qdl)));
  res += Math.floor(Math.ceil(ph / ed) / 10) * (1/25);
  res += fx(dis);
  return res;
}
function mr(rel, ph = 1){
  let res = rnd(rel * reload * (0.825**ugl) * (0.8**gl) * (0.775**qgl) * (1.05**(udl+dl+qdl)));
  res += Math.ceil(ph / ed) * (1/25);
  res += fx(dis);
  return res;
}
function hr(rel, ph = 1){
  let res = rnd(rel * reload * (0.825**ugl) * (0.8**gl) * (0.775**qgl) * (1.05**(udl+dl+qdl)));
  res += Math.ceil(ph / ed) * (1/25);
  res += fx(dis);
  return res;
}

/* ========================= lentil / yy 模式 ========================= */
function cal(petal){
  const f = n => petal === n;

  if (f("ubasic")||f("uclover")||f("usalt")||f("utalisman")||f("uyinyang")) return d(7290, h(7290)) / r(2.5, h(7290));
  if (f("basic") ||f("clover") ||f("salt") ||f("talisman") ||f("yinyang"))  return d(21870, h(21870)) / r(2.5, h(21870));
  if (f("qbasic")||f("qclover")||f("qsalt")||f("qtalisman")||f("qyinyang")||f("tbasic")) return d(65610, h(65610)) / r(2.5, h(65610));
  if (f("ubattery")) return d(26244,  h(1), "ubattery")  / (r(2.5) + 0.1);
  if (f("battery"))  return d(78732,  h(1), "battery")   / (r(2.5) + 0.1);
  if (f("qbattery")) return d(236196, h(1), "qbattery")  / (r(2.5) + 0.1);
  if (f("ubean")||f("ubean_0")) return d(14580,  h(8748)) / r(2, h(8748));
  if (f("ubean_1"))             return d(21870,  h(8748)) / r(2, h(8748));
  if (f("bean") ||f("bean_0"))  return d(43740,  h(26244)) / r(2, h(26244));
  if (f("bean_1"))              return d(65610,  h(26244)) / r(2, h(26244));
  if (f("qbean")||f("qbean_0")) return d(131220, h(78732)) / r(2, h(78732));
  if (f("qbean_1"))             return d(196830, h(78732)) / r(2, h(78732));
  if (f("ubone")) return d(10206, h(7290),  "ubone") / r(2.5, h(7290)  + 14580);
  if (f("bone"))  return d(30618, h(21870), "bone")  / r(2.5, h(21870) + 43740);
  if (f("qbone")) return d(91854, h(65610), "qbone") / r(2.5, h(65610) + 131220);
  if (f("ubroccoli")||f("ubroccoli_0")) return d(10935, h(7290)) / r(2.8, h(7290));
  if (f("ubroccoli_1")||f("ubroccoli_2")||f("ubroccoli_3"))
    return (d(10935, h(7290)) + parseInt(petal.slice(10)) * d(3645, h(2430))) / r(2.8, h(7290));
  if (f("broccoli")||f("broccoli_0")) return d(32805, h(21870)) / r(2.8, h(21870));
  if (f("broccoli_1")||f("broccoli_2")||f("broccoli_3"))
    return (d(32805, h(21870)) + parseInt(petal.slice(9)) * d(10935, h(7290))) / r(2.8, h(21870));
  if (f("qbroccoli")||f("qbroccoli_0")) return d(98415, h(65610)) / r(2.8, h(65610));
  if (f("qbroccoli_1")||f("qbroccoli_2")||f("qbroccoli_3"))
    return (d(98415, h(65610)) + parseInt(petal.slice(10)) * d(32805, h(21870))) / r(2.8, h(65610));
  if (f("ubur")) return d(3645,  h(3645))  / r(2, h(3645));
  if (f("bur"))  return d(10935, h(10935)) / r(2, h(10935));
  if (f("qbur")) return d(32805, h(32805)) / r(2, h(32805));
  if (f("ucactus")||f("ucactus_magic")) return d(5103,  h(10935)) / r(1, h(10935));
  if (f("cactus") ||f("cactus_magic"))  return d(15309, h(32805)) / r(1, h(32805));
  if (f("qcactus")||f("qcactus_magic")) return d(45927, h(98415)) / r(1, h(98415));
  if (f("ucard")) return (d(3645, h(21870))/r(2.5, h(21870)) + d(7290, h(18225))/r(2.5, h(18225))
                        + d(10935, h(14580))/r(2.5, h(14580)) + d(14580, h(10935))/r(2.5, h(10935))) / 4;
  if (f("card"))  return (d(10935, h(65610))/r(2.5, h(65610)) + d(21870, h(54675))/r(2.5, h(54675))
                        + d(32805, h(43740))/r(2.5, h(43740)) + d(43740, h(32805))/r(2.5, h(32805))) / 4;
  if (f("qcard")) return (d(32805, h(196830))/r(2.5, h(196830)) + d(65610, h(164025))/r(2.5, h(164025))
                        + d(98415, h(131220))/r(2.5, h(131220)) + d(131220, h(98415))/r(2.5, h(98415))) / 4;
  if (f("ucarrot_0")) return d(13122/5,  h(13122)) / r(1, h(13122));
  if (f("carrot_0"))  return d(39366/5,  h(39366)) / r(1, h(39366));
  if (f("qcarrot_0")) return d(118098/5, h(118098))/ r(1, h(118098));
  if (f("ucarrot")||f("ucarrot_1")) return d(13122,  h(13122))  / (r(1, h(13122))  + 0.5);
  if (f("carrot") ||f("carrot_1"))  return d(39366,  h(39366))  / (r(1, h(39366))  + 0.5);
  if (f("qcarrot")||f("carrot_1"))  return d(118098, h(118098)) / (r(1, h(118098)) + 0.5);
  if (f("uchip")) return d(5103,  h(2187)) * 10 / r(2.5, h(2187) + 0.9**10/(1-0.9**10)*0.04);
  if (f("chip"))  return d(15309, h(2187)) * 10 / (r(2.5, h(2187)) + 0.9**10/(1-0.9**10)*0.04);
  if (f("qchip")) return d(45927, h(2187)) * 10 / r(2.5, h(2187) + 0.9**10/(1-0.9**10)*0.04);
  if (f("uclaw_0")) return d(3645,  h(7290))  / r(3.5, h(7290));
  if (f("uclaw")||f("uclaw_1")) return d(3645,  h(7290),  "uclaw") / r(3.5, h(7290));
  if (f("claw_0"))  return d(10935, h(21870)) / r(3.5, h(21870));
  if (f("claw") ||f("claw_1"))  return d(10935, h(21870), "claw")  / r(3.5, h(21870));
  if (f("qclaw_0")) return d(32805, h(65610)) / r(3.5, h(65610));
  if (f("qclaw")||f("qclaw_1")) return d(32805, h(65610), "qclaw") / r(3.5, h(65610));
  if (f("uclay")||f("uclay_0")) return d(3645,  h(7290))  / r(2, h(7290));
  if (f("uclay_1"))             return d(72900, h(7290))  / r(2, h(7290));
  if (f("clay") ||f("clay_0"))  return d(10935, h(21870)) / r(2, h(21870));
  if (f("clay_1"))              return d(218700,h(21870)) / r(2, h(21870));
  if (f("qclay")||f("qclay_0")) return d(32805, h(65610)) / r(2, h(65610));
  if (f("qclay_1"))             return d(656100,h(65610)) / r(2, h(65610));
  if (f("ucog")) return d(13851, h(9477))  / r(2.5, h(9477));
  if (f("cog"))  return d(41553, h(28431)) / r(2.5, h(28431));
  if (f("qcog")) return d(124659,h(85293)) / r(2.5, h(85293));
  if (f("ucoin")) return d(10935, h(7290))  / r(2.5, h(7290));
  if (f("coin"))  return d(32805, h(21870)) / r(2.5, h(21870));
  if (f("qcoin")) return d(98415, h(65610)) / r(2.5, h(65610));
  if (f("ucoral")) return d(8019*3/7)  / (r(1.5) + 0.08) * 7;
  if (f("coral"))  return d(24057*3/7) / (r(1.5) + 0.08) * 7;
  if (f("qcoral")) return d(72171*3/7) / (r(1.5) + 0.08) * 7;
  if (f("ucorn")) return d(5832,  h(145800))  / r(7, h(145800));
  if (f("corn"))  return d(17496, h(437400))  / r(7, h(437400));
  if (f("qcorn")) return d(52488, h(1312200)) / r(7, h(1312200));
  if (f("udandelion")) return d(1944,  h(1944))  / r(1, h(1944))  * (3 + dup);
  if (f("dandelion"))  return d(5832,  h(5832))  / r(1, h(5832))  * (3 + dup);
  if (f("qdandelion")) return d(17496, h(17496)) / r(1, h(17496)) * (3 + dup);
  if (f("udice")) return d(7290  * (2.7 + 1.36*luck), h(7290))  / r(2.5, h(7290));
  if (f("dice"))  return d(21870 * (2.7 + 1.36*luck), h(21870)) / r(2.5, h(21870));
  if (f("qdice")) return d(65610 * (2.7 + 1.36*luck), h(65610)) / r(2.5, h(65610));
  if (f("udomino")) return (d(0,h(11664))*7 + d(729,h(11664)) + d(729*2,h(11664)) + d(729*3,h(11664)) + d(729*4,h(11664))*2 + d(729*5,h(11664)) + d(729*6,h(11664))*2 + d(729*8,h(11664)) + d(729*9,h(11664)) + d(729*10,h(11664)) + d(729*12,h(11664))*2 + d(729*15,h(11664)) + d(729*16,h(11664)) + d(729*18,h(11664)) + d(729*20,h(11664)) + d(729*24,h(11664)) + d(729*25,h(11664)) + d(729*30,h(11664)) + d(729*36,h(11664))) / 28 / r(1.0, h(11664));
  if (f("domino"))  return (d(0,h(34992))*7 + d(2187,h(34992)) + d(2187*2,h(34992)) + d(2187*3,h(34992)) + d(2187*4,h(34992))*2 + d(2187*5,h(34992)) + d(2187*6,h(34992))*2 + d(2187*8,h(34992)) + d(2187*9,h(34992)) + d(2187*10,h(34992)) + d(2187*12,h(34992))*2 + d(2187*15,h(34992)) + d(2187*16,h(34992)) + d(2187*18,h(34992)) + d(2187*20,h(34992)) + d(2187*24,h(34992)) + d(2187*25,h(34992)) + d(2187*30,h(34992)) + d(2187*36,h(34992))) / 28 / r(1.0, h(34992));
  if (f("qdomino")) return (d(0,h(104976))*7 + d(6561,h(104976)) + d(6561*2,h(104976)) + d(6561*3,h(104976)) + d(6561*4,h(104976))*2 + d(6561*5,h(104976)) + d(6561*6,h(104976))*2 + d(6561*8,h(104976)) + d(6561*9,h(104976)) + d(6561*10,h(104976)) + d(6561*12,h(104976))*2 + d(6561*15,h(104976)) + d(6561*16,h(104976)) + d(6561*18,h(104976)) + d(6561*20,h(104976)) + d(6561*24,h(104976)) + d(6561*25,h(104976)) + d(6561*30,h(104976)) + d(6561*36,h(104976))) / 28 / r(1.0, h(104976));
  if (f("udust")) return d(3159, h(1215)) / r(0.8, h(1215)) * (3 + dup);
  if (f("dust"))  return d(9477, h(3645)) / r(0.8, h(3645)) * (3 + dup);
  if (f("qdust")) return d(28431,h(10935)) / r(0.8, h(10935)) * (3 + dup);
  if (f("uagg")) return d(4374,  mh(182250),  "uagg") / mr(60, mh(182250))  * (4 + dup);
  if (f("agg"))  return d(13122, mh(546750),  "agg")  / mr(60, mh(547650))  * (4 + dup);
  if (f("qagg")) return d(39366, mh(1640250), "qagg") / mr(60, mh(1640250)) * (4 + dup);
  if (f("ubgg")) return d(5103,  mh(364500),  "ubgg") / mr(30, mh(1093500));

  if (f("qprivet_i"))  return 51030*poison*0.2 / T * g(r(4*0.7**8));
  if (f("qprivet_p"))  return 43740*poison*0.2 / T * g(r(4*0.7**8));
  if (f("qprivet_u"))  return 109350*poison*0.2 / T * g(r(4*0.7**8));
  if (f("uprivet_qg")) return (164025/0.7)*poison*0.2 / T * g(r(4*0.7**6));
  if (f("uprivet_qi")) return 153090*poison*0.2 / T * g(r(4*0.7**6));
  if (f("uprivet_qp")) return 131220*poison*0.2 / T * g(r(4*0.7**6));
  if (f("uprivet_qu")) return 328050*poison*0.2 / T * g(r(4*0.7**6));
  if (f("privet_qg"))  return (164025/0.7)*poison*0.2 / T * g(r(4*0.7**7));
  if (f("privet_qi"))  return 153090*poison*0.2 / T * g(r(4*0.7**7));
  if (f("privet_qp"))  return 131220*poison*0.2 / T * g(r(4*0.7**7));
  if (f("privet_qu"))  return 328050*poison*0.2 / T * g(r(4*0.7**7));
  if (f("qprivet_qg")) return (164025/0.7)*poison*0.2 / T * g(r(4*0.7**8));
  if (f("qprivet_qi")) return 153090*poison*0.2 / T * g(r(4*0.7**8));
  if (f("qprivet_qp")) return 131220*poison*0.2 / T * g(r(4*0.7**8));
  if (f("qprivet_qu")) return 328050*poison*0.2 / T * g(r(4*0.7**8));
  if (f("urice")) return d(2916,  h(729))  / T * g(r(0.05, h(729)));
  if (f("rice"))  return d(8748,  h(2187)) / T * g(r(0.05, h(2187)));
  if (f("qrice")) return d(26244, h(6561)) / T * g(r(0.05, h(6561)));
  if (f("urock")) return d(16038,  h(21870))  / T * g(r(3, h(21870)));
  if (f("rock"))  return d(48114,  h(65610))  / T * g(r(3, h(65610)));
  if (f("qrock")) return d(144342, h(196830)) / T * g(r(3, h(196830)));
  if (f("usand")) return d(3645,  h(911.25))  / T * g(r(1.5, h(911.25))  * (4 + dup));
  if (f("sand"))  return d(10935, h(2733.75)) / T * g(r(1.5, h(2733.75)) * (4 + dup));
  if (f("qsand")) return d(32805, h(8201.25)) / T * g(r(1.5, h(8201.25)) * (4 + dup));
  if (f("usawblade")) return d(29160,  h(18225))  / T * g(r(2.5, h(18225)));
  if (f("sawblade"))  return d(87480,  h(54675))  / T * g(r(2.5, h(54675)));
  if (f("qsawblade")) return d(262440, h(164025)) / T * g(r(2.5, h(164025)));
  if (f("ustarfish")) return d(3645,  h(5103))  / T * g(r(1.5, h(5103)));
  if (f("starfish"))  return d(10935, h(15309)) / T * g(r(1.5, h(15309)));
  if (f("qstarfish")) return d(32805, h(45927)) / T * g(r(1.5, h(45927)));
  if (f("ustick")) return d(65610, mh(65610), "ustick") / 5 * 4;
  if (f("stick"))  return d(65610, mh(65610), "stick")  / 5 * 4;
  if (f("qstick")) return d(65610, mh(65610), "qstick") / 5 * 4;
  if (f("ustinger")) return d(14580)  / T * g(r(10))  * (5 + dup);
  if (f("stinger"))  return d(43740)  / T * g(r(10))  * (5 + dup);
  if (f("qstinger")) return d(131220) / T * g(r(10))  * (5 + dup);
  if (f("ustinger(blood)")) return d(14580)  / T * g(r(7.5)) * (5 + dup);
  if (f("stinger(blood)"))  return d(43740)  / T * g(r(7.5)) * (5 + dup);
  if (f("qstinger(blood)")) return d(131220) / T * g(r(7.5)) * (5 + dup);
  if (f("utomato_0")) return d(3645, h(7290)) / T * g(r(2.5, h(7290)));
  if (f("utomato")||f("utomato_1")) return d(51030, h(7290)) / T * g(r(2.5, h(7290)) + 1);
  if (f("tomato_0"))  return d(10935, h(21870)) / T * g(r(2.5, h(21870)));
  if (f("tomato")||f("tomato_1"))   return d(153090, h(21870)) / T * g(r(2.5, h(21870)) + 1);
  if (f("qtomato_0")) return d(32805, h(65610)) / T * g(r(2.5, h(65610)));
  if (f("qtomato")||f("qtomato_1")) return d(459270, h(65610)) / T * g(r(2.5, h(65610)) + 1);
  if (f("utriangle")) return d(3645 + 2916*(utri-1), h(7290))  / T * g(r(2.0, h(7290)));
  if (f("triangle"))  return d(10935 + 8748*(tri-1), h(21870)) / T * g(r(2.0, h(21870)));
  if (f("qtriangle")) return d(32805 + 26244*tri,     h(65610)) / T * g(r(2.0, h(65610)));
  if (f("uuranium")) return 36450  * poison;
  if (f("uranium"))  return 109350 * poison;
  if (f("quranium")) return 328050 * poison;
  if (f("uweb(electric)")) return 3645;
  if (f("web(electric)"))  return 10935;
  if (f("qweb(electric)")) return 32805;
  if (f("uwing")) return d(14580,  h(7290))  / T * g(r(3, h(7290)));
  if (f("wing"))  return d(43740,  h(21870)) / T * g(r(3, h(21870)));
  if (f("qwing")) return d(131220, h(65610)) / T * g(r(3, h(65610)));
  if (f("uyucca")) return d(3645,  h(7290))  / T * g(r(2.5, h(7290)));
  if (f("yucca"))  return d(10935, h(21870)) / T * g(r(2.5, h(21870)));
  if (f("qyucca")) return d(32805, h(65610)) / T * g(r(2.5, h(65610)));

  return 0;
}

/* ========================= 核心执行与渲染 ========================= */
function analyze(buildStr, talentStr, x, y, mode, lentildis, rotspeed) {
    let build = buildStr.trim().split(/\s+/).filter(s => s);
    
    // 展开带数字前缀的花瓣 (如 99pearl、99ugl_)
    let expanded = true;
    while (expanded) {
        expanded = false;
        for (let i = 0; i < build.length; i++) {
            let petal = build[i];
            if (/^\d/.test(petal)) {
                expanded = true;
                let match = petal.match(/^(\d+)(.*)$/);
                let times = parseInt(match[1], 10);
                let name = match[2];
                build.splice(i, 1);
                for (let j = 0; j < times; j++) {
                    if (build.length >= 99) break; // ⚡️ 限制：只要总数达到99个，就不再继续添加
                    build.splice(i + j, 0, name);
                }
                break;
            }
        }
    }

    // ⚡️ 限制：如果直接手打了超过 99 个空格分隔的花瓣，直接截断保留前 99 个
    if (build.length > 99) {
        build = build.slice(0, 99);
  }
    let talent = talentStr.trim().split(/\s+/).filter(s => s);
    
    petalhealth = ph_buff[talent[0]] || 1;
    reload = reload_buff[talent[1]] || 1;
    summoner = summoner_buff[talent[2]] || 1;
    luck = luck_buff[talent[3]] || 0;
    poison = (poison_buff[talent[4]] || 1) * (cpoison_buff[talent[5]] || 1);
    dup = dup_buff[talent[6]] || 0;
    rot = 2.5;
    
    if (dup === 3) {
        build.unshift(build[0]);
        dup = 2;
    }
    
    if (talent.length >= 8) {
        rot += rot_buff[talent[7]] || 0;
    }

    ed = x;
    ea = y;
    dis = lentildis;

    const count = (arr, val) => arr.filter(v => v === val).length;

    ea -= (count(build, "ubur") + count(build, "ubur(yy)")) * 1093.5;
    ea -= (count(build, "bur") + count(build, "bur(yy)")) * 3280.5;
    ea -= (count(build, "qbur") + count(build, "qbur(yy)")) * 9841.5;

    luck += (count(build, "uclover") + count(build, "uclover_")) * 0.7;
    luck += (count(build, "clover") + count(build, "clover_")) * 0.8;
    luck += (count(build, "qclover") + count(build, "qclover_")) * 0.9;

    rot += (count(build, "ufaster") + count(build, "ufaster_")) * 1.7;
    rot += (count(build, "faster") + count(build, "faster_")) * 1.9;
    rot += (count(build, "qfaster") + count(build, "qfaster_")) * 2.1;
    
    rot *= 0.3 + rotspeed * 0.7;
    T = 2 * Math.PI / rot;

    udl = count(build, "udl") + count(build, "udl_");
    dl = count(build, "dl") + count(build, "dl_");
    qdl = count(build, "qdl") + count(build, "qdl_");

    ugl = count(build, "ugl") + count(build, "ugl_");
    gl = count(build, "gl") + count(build, "gl_");
    qgl = count(build, "qgl") + count(build, "qgl_");

    ph_bonus = petalhealth + udl * 0.3 + dl * 0.45 + qdl * 0.6;
    utri = count(build, "utriangle") + count(build, "utriangle_");
    tri = count(build, "triangle") + count(build, "triangle_");

    let dps = [];
    if (mode === "lentil" || mode === "yy") {
        for (let petal of build) {
            dps.push(pyRound(cal(petal)));
        }
    } else if (mode === "wheel") {
        for (let petal of build) {
            dps.push(pyRound(calw(petal)));
        }
    }

    let infoHtml = "";
    if (mode === "wheel") {
        infoHtml += `Rotation Speed: ${rot / (0.3 + 0.7 * rotspeed)} * (0.3 + 0.7 * ${rotspeed}) = ${rot.toFixed(3)}\n`;
        infoHtml += `Period(T): ${(2 * Math.PI / rot).toFixed(3)}s\n`;
    }

    let tableHtml = `<div class="tbl-wrap"><table><tr><th>花瓣</th>`;
    for (let petal of build) tableHtml += `<th>${petal}</th>`;
    tableHtml += `<th>总计</th></tr><tr><td class="rowhead">DPS</td>`;
    for (let val of dps) tableHtml += `<td class="dps">${val}</td>`;
    let total = dps.reduce((a, b) => a + b, 0);
    tableHtml += `<td class="total">${total}</td></tr></table></div>`;

    document.getElementById("info").innerText = infoHtml;
    document.getElementById("out").innerHTML = tableHtml;
}

/* ========================= 事件绑定 ========================= */
document.getElementById("run").addEventListener("click", () => {
    try {
        const build = document.getElementById("build").value;
        const talent = document.getElementById("talent").value;
        const x = parseFloat(document.getElementById("x").value) || 0;
        const y = parseFloat(document.getElementById("y").value) || 0;
        const mode = document.getElementById("mode").value;
        const lentildis = parseFloat(document.getElementById("lentildis").value) || 0;
        const rotspeed = parseFloat(document.getElementById("rotspeed").value) || 1;
        
        analyze(build, talent, x, y, mode, lentildis, rotspeed);
    } catch (e) {
        console.error(e);
        document.getElementById("out").innerHTML = `<div class="err">计算时出错：${e.message}</div>`;
        document.getElementById("info").innerText = "";
    }
});
