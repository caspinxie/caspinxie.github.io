<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 欢迎回来</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
        }

        /* ===== 卡片容器 ===== */
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 40px;
            padding: 48px 36px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-wrapper:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
        }

        /* ===== 头部 ===== */
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header .icon-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, #6c5ce7, #a29bfe);
            border-radius: 24px;
            font-size: 36px;
            color: #fff;
            box-shadow: 0 12px 28px rgba(108, 92, 231, 0.4);
            margin-bottom: 18px;
            transition: transform 0.3s ease;
        }

        .login-header .icon-logo:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            margin-top: 6px;
            font-weight: 400;
        }

        /* ===== 表单 ===== */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            position: relative;
        }

        .form-group .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 18px;
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px 16px 54px;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            caret-color: #a29bfe;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #a29bfe;
            background: rgba(255, 255, 255, 0.10);
            box-shadow: 0 0 0 4px rgba(162, 155, 254, 0.15);
        }

        .form-group input:focus~.input-icon,
        .form-group input:focus+.input-icon {
            color: #a29bfe;
        }

        /* 密码可见切换 */
        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.35);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ===== 选项行 (记住我 & 忘记密码) ===== */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 4px 0 4px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
        }

        .remember-me input[type="checkbox"]:checked {
            background: linear-gradient(145deg, #6c5ce7, #a29bfe);
            border-color: #a29bfe;
        }

        .remember-me input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }

        .forgot-link {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        .forgot-link:hover {
            color: #a29bfe;
        }

        /* ===== 登录按钮 ===== */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(145deg, #6c5ce7, #a29bfe);
            border: none;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.35);
            letter-spacing: 0.5px;
            margin-top: 4px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(108, 92, 231, 0.5);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-login .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-login i {
            font-size: 20px;
        }

        /* ===== 分隔线 ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 18px;
            margin: 10px 0 6px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            font-weight: 500;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== 社交登录 ===== */
        .social-login {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            font-size: 22px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .social-btn.google:hover {
            color: #ea4335;
            border-color: #ea4335;
            background: rgba(234, 67, 53, 0.10);
        }

        .social-btn.github:hover {
            color: #f0f6fc;
            border-color: #f0f6fc;
            background: rgba(240, 246, 252, 0.08);
        }

        .social-btn.twitter:hover {
            color: #1da1f2;
            border-color: #1da1f2;
            background: rgba(29, 161, 242, 0.10);
        }

        /* ===== 注册引导 ===== */
        .signup-cta {
            text-align: center;
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 15px;
        }

        .signup-cta a {
            color: #a29bfe;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-cta a:hover {
            color: #c8c1ff;
            text-decoration: underline;
        }

        /* ===== 错误提示 ===== */
        .error-message {
            background: rgba(255, 82, 82, 0.12);
            border-left: 4px solid #ff5252;
            padding: 12px 16px;
            border-radius: 12px;
            color: #ff8a8a;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            font-size: 18px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 36px 24px;
                border-radius: 28px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .form-group input {
                padding: 14px 16px 14px 48px;
                font-size: 15px;
            }

            .btn-login {
                font-size: 16px;
                padding: 15px;
            }

            .social-btn {
                width: 46px;
                height: 46px;
                font-size: 19px;
            }
        }

        @media (max-width: 360px) {
            .login-wrapper {
                padding: 28px 16px;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }

        /* ===== 加载微效 (按钮点击反馈) ===== */
        .btn-login.loading .btn-content i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 简单的入场动画 */
        .login-wrapper {
            animation: fadeUp 0.7s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 抖动动画 */
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-8px);
            }
            40% {
                transform: translateX(8px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">

        <!-- ===== 头部 ===== -->
        <div class="login-header">
            <div class="icon-logo">
                <i class="fas fa-lock"></i>
            </div>
            <h1>欢迎回来</h1>
            <p>使用您的用户名或邮箱登录</p>
        </div>

        <!-- ===== 错误提示 ===== -->
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">请输入正确的用户名、邮箱和密码</span>
        </div>

        <!-- ===== 登录表单 ===== -->
        <form class="login-form" id="loginForm" novalidate>
            <!-- 用户名 -->
            <div class="form-group">
                <input
                type="text"
                id="usernameInput"
                placeholder="用户名"
                value="demo_user"
                required
                autocomplete="username"
                />
                <i class="fas fa-user input-icon"></i>
            </div>

            <!-- 邮箱 -->
            <div class="form-group">
                <input
                type="email"
                id="emailInput"
                placeholder="邮箱地址"
                value="user@example.com"
                required
                autocomplete="email"
                />
                <i class="fas fa-envelope input-icon"></i>
            </div>

            <!-- 密码 -->
            <div class="form-group">
                <input
                type="password"
                id="passwordInput"
                placeholder="密码"
                value="123456"
                required
                autocomplete="current-password"
                minlength="6"
                />
                <i class="fas fa-key input-icon"></i>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="切换密码可见性">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>

            <!-- 选项 -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" checked />
                    <span>记住我</span>
                </label>
                <a href="#" class="forgot-link">忘记密码？</a>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-content">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    登录
                </span>
            </button>
        </form>

        <!-- ===== 分隔线 ===== -->
        <div class="divider">或使用以下方式登录</div>

        <!-- ===== 社交登录 ===== -->
        <div class="social-login">
            <a href="#" class="social-btn google" aria-label="Google 登录">
                <i class="fab fa-google"></i>
            </a>
            <a href="#" class="social-btn github" aria-label="GitHub 登录">
                <i class="fab fa-github"></i>
            </a>
            <a href="#" class="social-btn twitter" aria-label="Twitter 登录">
                <i class="fab fa-twitter"></i>
            </a>
        </div>

        <!-- ===== 注册引导 ===== -->
        <div class="signup-cta">
            还没有账号？ <a href="#">立即注册</a>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ----- DOM 引用 -----
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('usernameInput');
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const toggleBtn = document.getElementById('togglePassword');
            const eyeIcon = document.getElementById('eyeIcon');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            // ----- 密码可见切换 -----
            toggleBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                eyeIcon.classList.toggle('fa-eye');
                eyeIcon.classList.toggle('fa-eye-slash');
            });

            // ----- 表单验证 & 提交 -----
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // 清除旧错误
                errorMsg.classList.remove('show');

                const username = usernameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                // ---- 简单验证 ----
                let hasError = false;
                let errMessage = '';

                // 用户名：非空
                if (!username) {
                    errMessage = '请输入用户名';
                    hasError = true;
                }

                // 邮箱：非空 + 基本格式
                if (!hasError && !email) {
                    errMessage = '请输入邮箱地址';
                    hasError = true;
                } else if (!hasError && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    errMessage = '请输入有效的邮箱地址 (例如: name@domain.com)';
                    hasError = true;
                }

                // 密码：非空 + 长度
                if (!hasError && !password) {
                    errMessage = '请输入密码';
                    hasError = true;
                } else if (!hasError && password.length < 6) {
                    errMessage = '密码至少 6 个字符';
                    hasError = true;
                }

                // ---- 显示错误或跳转 ----
                if (hasError) {
                    errorText.textContent = errMessage;
                    errorMsg.classList.add('show');
                    // 抖动效果
                    errorMsg.style.animation = 'none';
                    setTimeout(() => {
                        errorMsg.style.animation = 'shake 0.4s ease';
                    }, 10);
                    return;
                }

                // ---- 模拟登录加载，然后跳转到 florr.html ----
                loginBtn.classList.add('loading');
                loginBtn.querySelector('.btn-content i').className = 'fas fa-spinner fa-pulse';
                loginBtn.querySelector('.btn-content span').textContent = '登录中...';
                loginBtn.disabled = true;

                // 模拟异步请求，延迟后跳转
                setTimeout(function() {
                    // 登录成功，跳转到 florr.html
                    window.location.href = 'florr.html';
                }, 1200); // 1.2 秒后跳转，让用户看到加载状态
            });

            // ----- 输入时自动隐藏错误 -----
            [usernameInput, emailInput, passwordInput].forEach(input => {
                input.addEventListener('input', function() {
                    errorMsg.classList.remove('show');
                });
            });

            // 清除默认的 errorMessage 动画（避免干扰）
            errorMsg.style.animation = 'none';

        })();
    </script>

</body>
</html>
