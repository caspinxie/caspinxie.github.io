<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPS Build Analyzer</title>
<style>
  :root{
    --bg:#0e1117; --panel:#1a1f2b; --line:#2b3242; --text:#e8edf7;
    --muted:#8b95ab; --accent:#6ea8fe; --good:#5ad18a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px;min-height:100vh;color:var(--text);
    background:radial-gradient(1200px 600px at 50% -10%, #1d2740, #0e1117 60%);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
  }
  h1{font-size:22px;font-weight:700;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;color:var(--muted);letter-spacing:.03em}
  input,select{
    background:#0f141d;border:1px solid var(--line);border-radius:9px;color:var(--text);
    padding:9px 11px;font-size:14px;font-family:inherit;outline:none;transition:.15s;width:100%;
  }
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,254,.15)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
  button{
    background:linear-gradient(180deg,#4b8ef8,#3468c9);border:0;border-radius:10px;color:#fff;
    font-weight:600;font-size:15px;padding:11px 22px;cursor:pointer;transition:.15s;
  }
  button:hover{filter:brightness(1.1)}
  button:active{transform:translateY(1px)}
  button.ghost{
    background:#1c2432;border:1px solid var(--line);color:var(--muted);
    font-size:13px;font-weight:500;padding:8px 14px;
  }
  button.ghost:hover{color:var(--text);border-color:var(--accent)}
  .tbl-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 12px;text-align:center;white-space:nowrap}
  th{background:#141a25;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.04em}
  td.rowhead{color:var(--muted);font-size:12px;background:#141a25}
  td.dps{font-variant-numeric:tabular-nums;color:#cfe1ff}
  td.total{color:var(--good);font-weight:700;font-variant-numeric:tabular-nums}
  .info{color:var(--muted);font-size:13px;margin-bottom:12px;white-space:pre-line;font-variant-numeric:tabular-nums}
  .err{color:#ff7b7b;font-size:14px}
  .note{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.7}
  code{background:#0f141d;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
</style>
</head>
<body>

<h1>DPS Build Analyzer</h1>
<div class="sub">花瓣 / 天赋 / 生物体伤 / 生物护甲 &nbsp;→&nbsp; 各花瓣 DPS 与总 DPS</div>

<div class="panel">
  <div class="grid">
    <div class="field" style="grid-column:span 2">
      <label>花瓣（空格分隔，可加数量前缀）</label>
      <input id="build" value="2ugl_ 4dust bur 2ulentil" spellcheck="false">
    </div>
    <div class="field" style="grid-column:span 2">
      <label>天赋（ph reload summon luck poison cpoison dup [rot]）</label>
      <input id="talent" value="- Et - - - - S" spellcheck="false">
    </div>
    <div class="field">
      <label>生物体伤 x</label>
      <input id="x" type="number" step="any" value="21870">
    </div>
    <div class="field">
      <label>生物护甲 y</label>
      <input id="y" type="number" step="any" value="583.2">
    </div>
    <div class="field">
      <label>模式</label>
      <select id="mode">
        <option value="lentil">lentil</option>
        <option value="yy">yy</option>
        <option value="wheel">wheel</option>
      </select>
    </div>
    <div class="field">
      <label>lentil 距离</label>
      <input id="lentildis" type="number" step="any" value="0">
    </div>
    <div class="field">
      <label>转速 rotspeed</label>
      <input id="rotspeed" type="number" step="any" value="1">
    </div>
  </div>

  <div class="actions">
    <button id="run">计算 DPS</button>
    <button class="ghost" data-ex="1">示例：triangle wheel</button>
    <button class="ghost" data-ex="2">示例：chip yy</button>
    <button class="ghost" data-ex="3">示例：dust lentil</button>
  </div>
</div>

<div class="panel">
  <div id="info" class="info"></div>
  <div id="out"></div>
</div>

<div class="note">
  用法：花瓣前加数字表示多个（如 <code>2pearl</code>）；不计入 DPS 但发挥效果的花瓣加下划线（如 <code>ugl_</code>）；被 yy 的花瓣写成 <code>bur(yy)</code>。<br>
  原作者：Huo_guo_tu31
</div>
